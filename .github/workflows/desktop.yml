name: Desktop builds
on:
  push:
    branches: [electron]
  pull_request:
    branches: [electron]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test Electron window
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron
      - name: Package desktop app
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Techlead-Desk-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 14
