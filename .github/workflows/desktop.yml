name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build standalone web app
        if: runner.os == 'Linux'
        run: npm run build:web
      - name: Install browser for web tests
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Test browser and standalone HTML
        if: runner.os == 'Linux'
        run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: Techlead-Desk-Web
          path: dist/techlead-desk-unico.html
          if-no-files-found: error
      - name: Test Electron window
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron
      - name: Package desktop app
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Techlead-Desk-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Techlead-Desk-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Techlead Desk ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            *.html
            *.AppImage
            *.deb
            *.exe
            *.dmg
          fail_on_unmatched_files: true
